name: 内容勘误 / Correction
description: 反馈做题本及其他真题资料的题目、选项、答案或解析错误，以及英语释义、翻译等错误。
title: "[内容勘误] "
body:
  - type: markdown
    attributes:
      value: |
        请尽量给出能找到原位置的信息。暂时没有字典或其他版本的证据也可以提交，先描述发现的问题。
        截图可拖入附件栏或直接粘贴；请先遮住个人信息。
        做题本留白不足、续页缺漏或答题格排版问题请选「问题反馈」。
  - type: dropdown
    id: subject
    attributes:
      label: 学科或板块
      options:
        - 英语（考研、雅思等）
        - 政治
        - 27考研政治背诵笔记（PDF）
        - 计算机／考研408
        - 数学（注明数学一／二／三）
        - 考研英语真题 PDF（注明英语一／二）
        - 考研管综 199（PDF／Anki）
        - 考研经综 396（PDF／Anki）
        - 其他学科或通用功能
    validations:
      required: true
  - type: input
    id: material
    attributes:
      label: 使用的 PDF、卡包或页面
      description: 请写资料名称和版本。PDF 或 Anki 请提供附件文件名，并附固定发行页（如有）；网页请附完整地址。 背诵笔记的文件名为 2027-politics-study-notes.pdf。
      placeholder: 例如：数学二做题本 · 2026-11-21 修订版（math-exams 固定发行页）
    validations:
      required: true
  - type: dropdown
    id: workbook_layout
    attributes:
      label: 做题本版式（仅做题本相关反馈填写）
      options:
        - A4 动态留白（按解析留白）
        - A4 每页最多两题
        - A4 每页最多三题
        - A5 横向一页一题
        - 不确定
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: 具体位置
      description: 写单词或题目。数学请注明数学一／二／三、年份、试卷IV／V（如有）、题型、题号、小问及公式位置；政治／408请给出年份、题型、题号及小问（408可注明数据结构、组成原理、操作系统或网络）；199／396 请注明科目、年份、题型和题号；英语请给出年份、英语一／二、题型、Text 和题号。PDF 请补充阅读器页码，词卡请补充单元。背诵笔记还请注明所属章节和考点编号（如有）。
      placeholder: 例如：2009年408，单选题第4题，选项B的树图；或2005年政治，多选题第16题
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 哪类内容需要核对？
      options:
        - 题目、材料、选项或题号
        - 标准答案、参考答案或解析
        - 错误换行、跨页续段或题目图表
        - 背诵笔记的考点、表述或插图
        - 释义、词性或词条归属
        - 英文原句或来源排印
        - 中文翻译或双语 chunk
        - 词频、义项次数或例句序号
        - 音标、录音或词源内容
        - 其他内容
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 现在的内容和发现的问题
      description: 粘贴当前题面、选项、答案、原句或笔记原文，说明具体哪里不对；不要只写“答案错了”。
      placeholder: |
        当前题目／原句及答案：
        具体问题或疑问：
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 建议的修正和依据（可选）
      description: 有其他版本PDF、原题／解析页码、标准答案、词典详细释义或原文链接时附上；数学／政治／408请区分来源参考答案、解析与自行推导。不确定或暂时没有依据时可只写疑问。
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: 截图或其他版本对照（可选）
      description: 可以拖入图片或粘贴截图；请保留便于核对的原句、页码和题型。
    validations:
      required: false
