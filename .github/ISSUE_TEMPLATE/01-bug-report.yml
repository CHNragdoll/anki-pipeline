name: 问题反馈 / Bug
description: 卡片、网页、音频、导入或生成过程中出现异常。
title: "[问题反馈] "
body:
  - type: markdown
    attributes:
      value: |
        按下面的提示填写即可，不需要懂代码。
        设备、系统、软件名称、完整软件版本号和软件桌面图标截图须分别提供，以便区分不同客户端。
        桌面或手机主屏幕截图请保留软件图标和名称，并先遮住个人信息；问题截图、录屏和日志可另附。
        如果是释义、原句、词频或归属有误，请改用“内容勘误”模板。
  - type: dropdown
    id: area
    attributes:
      label: 哪个部分有问题？
      options:
        - Anki 卡片或导入
        - 网页书架、卡片或复习
        - 真题整卷、重排版或原卷跳转
        - 发音、词典或词源
        - 生成、导出或数据库
        - 其他
    validations:
      required: true
  - type: input
    id: material
    attributes:
      label: 使用的书籍、卡包或页面
      description: 写书名和年份；有 APKG 文件名、发布版本或页面链接时一起填写。
      placeholder: 例如：2027 红宝书，网页书架里的 more 卡片
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备品牌和型号
      description: 请填写实际使用的电脑、手机或平板型号。
      placeholder: 例如：MacBook Air M3、iPhone 15、华为 Mate 60
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: 操作系统及完整版本号
      description: 在设备的“关于本机”或“关于手机”中查看，不要只写“苹果”或“安卓”。
      placeholder: 例如：macOS 15.6、iOS 18.1、Android 14
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: 软件完整名称
      description: 按桌面或手机主屏幕图标下的实际名称填写；网页问题填写使用的浏览器名称。
      placeholder: 例如：Anki、AnkiMobile、AnkiDroid、Safari；请以实际安装的软件为准
    validations:
      required: true
  - type: input
    id: software_version
    attributes:
      label: 软件完整版本号
      description: 打开该软件的“关于”或“设置”查看，填写完整版本号和构建号（如有），不要只写“最新版”。
      placeholder: 请照软件“关于”页面填写完整版本号；有构建号时一并填写
    validations:
      required: true
  - type: upload
    id: software_desktop_screenshot
    attributes:
      label: 软件桌面图标和名称截图
      description: 必须上传电脑桌面、启动器或手机主屏幕截图，清楚显示该软件的图标和名称，用来区分相似客户端。不要只截卡片内部；请遮住个人信息。
    validations:
      required: true
      accept: ".png,.jpg,.jpeg,.webp"
  - type: textarea
    id: steps
    attributes:
      label: 怎么操作会出现？
      description: 从哪个入口开始、搜索哪个词、点了哪个按钮？如果页面已经卡住，不必反复尝试。
      placeholder: |
        1. 从书架进入 2027 红宝书。
        2. 搜索 more，打开卡片。
        3. 点击“显示答案”。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么？
      description: 写看到了什么、哪里缺失或卡住；知道等待时长、报错原文时也可附上。
      placeholder: 例如：点击后一直停在正面，按钮没有反应。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 原本希望发生什么？
      placeholder: 例如：点击后完整显示背面，释义和例句可以正常展开。
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: 截图、录屏或日志（可选）
      description: 可以拖入图片或视频；有报错时粘贴必要片段即可，不需要上传整个学习数据库。
    validations:
      required: false
