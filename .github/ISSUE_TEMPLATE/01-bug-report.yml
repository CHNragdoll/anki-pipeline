name: 问题反馈 / Bug
description: 英语、政治、408等卡包的刷卡、选题、查看答案、网页、音频或导入异常。
title: "[问题反馈] "
body:
  - type: markdown
    attributes:
      value: |
        按下面的提示填写即可，不需要懂代码。
        设备、系统、软件名称、完整软件版本号和软件桌面图标截图须分别提供，以便区分不同客户端。
        桌面或手机主屏幕截图请保留软件图标和名称，并先遮住个人信息；问题截图、录屏和日志可另附。
        如果是题目、选项、答案解析、释义、原句、词频或归属有误，请改用“内容勘误”模板。
  - type: dropdown
    id: subject
    attributes:
      label: 学科或板块
      options:
        - 英语（考研、雅思等）
        - 政治
        - 计算机／考研408
        - 数学
        - 其他学科或通用功能
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 哪个部分有问题？
      options:
        - Anki 卡片或导入
        - 网页书架、卡片或复习
        - 试题选项、判题或查看答案（政治／408等）
        - 题型子牌组、整卷阅读、重排版或原卷跳转
        - 发音、词典或词源
        - 生成、导出或数据库
        - 其他
    validations:
      required: true
  - type: input
    id: material
    attributes:
      label: 使用的书籍、卡包或页面
      description: 写书名、年份和版本；Anki 请附实际 APKG 文件名或固定发行页，网页请附完整地址。
      placeholder: 例如：考研408历年真题，CS408-Past-Exams-Full-20261102.apkg；或政治／红宝书及对应固定发行页
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: 从哪个入口出现问题？
      options:
        - Anki 正常刷卡
        - Anki 浏览搜索后预览
        - 网页逐题卡片或复习
        - 网页整卷阅读、原卷或重排版
        - 导入、导出或生成
        - 其他入口
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 具体单词或题目位置（如涉及）
      description: 试题请写年份、学科／卷种、题型和题号；词卡请写单词、书籍和单元。整个导入失败等不涉及具体题目时可留空。
      placeholder: 例如：2025年408，综合应用题第47题；或2021年政治，多选题第17题
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: 设备品牌和型号
      description: 请填写实际使用的电脑、手机或平板型号。
      placeholder: 例如：MacBook Air M3、iPhone 15、华为 Mate 60
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: 操作系统及完整版本号
      description: 在设备的“关于本机”或“关于手机”中查看，不要只写“苹果”或“安卓”。
      placeholder: 例如：macOS 15.6、iOS 18.1、Android 14
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: 软件完整名称
      description: 按桌面或手机主屏幕图标下的实际名称填写；网页问题填写使用的浏览器名称。
      placeholder: 例如：Anki、AnkiMobile、AnkiDroid、Safari；请以实际安装的软件为准
    validations:
      required: true
  - type: input
    id: software_version
    attributes:
      label: 软件完整版本号
      description: 打开该软件的“关于”或“设置”查看，填写完整版本号和构建号（如有），不要只写“最新版”。
      placeholder: 请照软件“关于”页面填写完整版本号；有构建号时一并填写
    validations:
      required: true
  - type: upload
    id: software_desktop_screenshot
    attributes:
      label: 软件桌面图标和名称截图
      description: 必须上传电脑桌面、启动器或手机主屏幕截图，清楚显示该软件的图标和名称，用来区分相似客户端。不要只截卡片内部；请遮住个人信息。
    validations:
      required: true
      accept: ".png,.jpg,.jpeg,.webp"
  - type: textarea
    id: steps
    attributes:
      label: 怎么操作会出现？
      description: 写清从哪个入口开始、打开哪张卡、选择了哪些选项和点了哪个按钮。请区分正常刷卡与浏览搜索后预览；页面已经卡住时不必反复尝试。
      placeholder: |
        1. 进入考研政治历年真题 → 2021年 → 多选题，打开第17题。
        2. 依次选择A、C，再次点击A取消选择。
        3. 点击“查看答案”，观察题面和答案显示。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么？
      description: 写看到了什么、哪里缺失或卡住；知道等待时长、报错原文时也可附上。
      placeholder: 例如：点击后一直停在正面，按钮没有反应。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 原本希望发生什么？
      placeholder: 例如：点击后完整显示背面，释义和例句可以正常展开。
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: 截图、录屏或日志（可选）
      description: 可以拖入图片或视频；有报错时粘贴必要片段即可，不需要上传整个学习数据库。
    validations:
      required: false
