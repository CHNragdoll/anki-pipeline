name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/verify_project.py
      - run: node --check anki_pipeline/templates/script.js
