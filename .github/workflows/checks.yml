name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/verify_project.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: uv run anki-pipeline --help
      - run: uv build --wheel --out-dir dist
      - run: |
          uv venv --python ${{ matrix.python }} /tmp/anki-wheel-test
          uv pip install --python /tmp/anki-wheel-test/bin/python dist/*.whl
          cd /tmp
          /tmp/anki-wheel-test/bin/anki-pipeline --help
          /tmp/anki-wheel-test/bin/python -c "from importlib.resources import files; assert files('anki_pipeline').joinpath('templates/countdown.js').is_file()"
          /tmp/anki-wheel-test/bin/python -c "from pathlib import Path; import anki_pipeline; assert Path(anki_pipeline.__file__).resolve().is_relative_to(Path('/tmp/anki-wheel-test'))"
      - name: Verify installed wheel with external completion fixtures
        run: |
          mkdir /tmp/anki-wheel-fixtures
          cp -R tests /tmp/anki-wheel-fixtures/tests
          cd /tmp/anki-wheel-fixtures
          /tmp/anki-wheel-test/bin/python -m unittest \
            tests.test_reading_completion.ReadingCompletionTests.test_default_sidecar_uses_input_root_when_module_is_installed_elsewhere \
            tests.test_cli.ConfigAndCliTests.test_codex_completion_inputs_follow_configured_project_or_config_file \
            tests.test_cli.ConfigAndCliTests.test_build_and_web_preview_use_the_configured_codex_completion_inputs \
            tests.test_cli.ConfigAndCliTests.test_deck_display_name_can_change_without_replacing_its_identity -v
