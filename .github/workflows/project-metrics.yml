name: Project metrics
on:
  schedule:
    - cron: '23 * * * *' # Hourly at minute 23; GitHub may delay scheduled runs.
  workflow_dispatch:
  release:
    types: [published, edited, deleted, unpublished]
  push:
    branches: [main]
    paths:
      - README.md
      - assets/project-metrics/traffic-seed.json
      - assets/project-metrics/download-seed.json
      - scripts/project_metrics.py
      - scripts/project_metrics_dashboard.html
      - scripts/render_exam_pages.py
      - scripts/exam_download_page.html
      - assets/math-pdf/**
      - assets/politics-pdf/**
      - assets/english-pdf/**
      - assets/cs408-pdf/**
      - assets/management199-pdf/**
      - assets/economics396-pdf/**
      - assets/pages-verification/**
      - .github/workflows/project-metrics.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: project-metrics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore accumulated history from the data-only branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote --exit-code --heads origin project-metrics > /dev/null; then
            git fetch --no-tags origin project-metrics:refs/remotes/origin/project-metrics
            git show origin/project-metrics:history.json > "$RUNNER_TEMP/project-metrics-history.json"
            if git cat-file -e origin/project-metrics:latest-stargazers.json; then
              git show origin/project-metrics:latest-stargazers.json > "$RUNNER_TEMP/previous-stargazers.json"
            fi
          else
            # Only absence (exit 2) is a valid first run; a network failure must not reset history.
            code=$?
            test "$code" -eq 2
            cp assets/project-metrics/history.json "$RUNNER_TEMP/project-metrics-history.json"
          fi
      - name: Collect official data and render SVGs
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_METRICS_TOKEN: ${{ secrets.PROJECT_METRICS_TOKEN }}
        run: |
          python3 scripts/project_metrics.py --history "$RUNNER_TEMP/project-metrics-history.json" \
            --previous-star-roster "$RUNNER_TEMP/previous-stargazers.json" \
            --star-archive "$RUNNER_TEMP/stargazers.json" \
            --output "$RUNNER_TEMP/project-metrics-render"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'project-metrics-render/snapshot.json'
          data = json.loads(p.read_text())
          if data['traffic_unavailable']:
              print('::warning::Traffic unavailable. Historical dates are preserved. Configure PROJECT_METRICS_TOKEN with repository Administration: read and Contents: read.')
          PY
      - name: Update only the dedicated data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="$RUNNER_TEMP/project-metrics-publish"
          if git show-ref --verify --quiet refs/remotes/origin/project-metrics; then
            git worktree add --detach "$target" origin/project-metrics
          else
            mkdir -p "$target"
            git -C "$target" init -b project-metrics
            git -C "$target" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          rendered="$RUNNER_TEMP/project-metrics-render"
          archive="runs/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$target/$archive"
          test ! -e "$target/$archive/snapshot.json"
          cp "$rendered/snapshot.json" "$target/$archive/snapshot.json"
          cp "$RUNNER_TEMP/stargazers.json" "$target/$archive/stargazers.json"
          if jq -e '.users != null' "$RUNNER_TEMP/stargazers.json" > /dev/null; then
            cp "$RUNNER_TEMP/stargazers.json" "$target/latest-stargazers.json"
          fi
          cp "$rendered/"* "$target/"
          git -C "$target" config user.name 'github-actions[bot]'
          git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" add -- '*.json' '*.svg' '*.html' "$archive/snapshot.json" "$archive/stargazers.json"
          git -C "$target" commit -m "chore: archive project metrics run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git -C "$target" push origin HEAD:refs/heads/project-metrics
      - name: Add exam download pages and sitemap
        run: python3 scripts/render_exam_pages.py "$RUNNER_TEMP/project-metrics-render"
      - name: Upload public statistics site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/project-metrics-render
      - name: Deploy public statistics site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
