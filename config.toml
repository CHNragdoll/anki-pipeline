# Relative paths are resolved against this config file, never the shell cwd.
[paths]
database = "data/anki.sqlite3"
legacy_database = "../anki_template/V2.0/anki_data.db"
wordbook = "../anki_template/V2.0/核心词汇.xlsx"
legacy_audio = "../anki_template/audio_us"
# Optional already-built legacy package: fast local recovery of archived media.
legacy_package = "../anki_template/output_apkg/26刘晓艳考研英语你还在背单词吗艾宾浩斯曲线版.apkg"
audio = "data/audio"
output = "output"
backups = "backups"
# Set pdf to your local examination PDF when extracting new examples.
# pdf = "/absolute/path/to/exams.pdf"

[deck]
name = "27刘晓艳考研英语你还在背单词吗艾宾浩斯曲线版"
identity_name = "考研英语 · 精选真题" # Keep existing IDs when changing the displayed root.
max_examples = 5

[exam_library]
root = "../exam-library"
base_url = "http://localhost:8765"
reader = "latex"
max_examples = 0 # 0 exports every matched exam-library sentence per word.
sentence_source = "codex"
codex_index_root = "../exam-library/data/staging/codex-translations-v1"
# Reviewed completion/option sidecars are external inputs, never wheel resources.
reading_completion_path = "data/reading-completions-v1.json"

[local_dictionary]
root = "../dictionary-unpacked" # Read-only exported Oxford and Merriam-Webster sources.

[ecdict]
root = "../ECDICT" # Read-only fallback senses/inflections and exam tags.

[etymology]
root = "../dictionary-unpacked/cigen-en-new" # Read-only extracted root/affix source; bundled without a service.
