<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>QA CV 原生查找 · 独立小样</title>
<style>body{margin:0;font:14px/1.4 system-ui;color:#172033;background:#eef2f7}.controls{position:fixed;z-index:10;inset:0 0 auto;padding:8px 12px;background:white;border-bottom:1px solid #bbb;box-sizing:border-box;min-height:124px}button,a{margin:2px 6px 2px 0;padding:4px 7px}#status{font:12px/1.3 ui-monospace;white-space:pre-wrap;max-height:52px;overflow:auto}iframe{border:0;box-sizing:border-box;background:white}label{margin-right:14px}</style>
<div class="controls"><strong>自造小样：完整 DOM，非真实卡片/速度验收</strong> <a href="?mode=baseline">Baseline 模式</a><a href="?mode=cv">CV auto 模式</a>
<br><button id="promote" disabled>显示已准备小页</button><button id="plain">记录普通 Find 后</button><button id="detail">记录闭合 Find 后</button><button id="anchor">记录原生锚点后</button><button id="download">下载 JSON</button>
<label><input type="checkbox" id="plainFound">原生普通命中且可见</label><label><input type="checkbox" id="detailFound">原生闭合命中且可见</label><label><input type="checkbox" id="anchorFound">原生锚点定位可见</label>
<div id="status">准备中</div></div><iframe id="sample" title="CV 原生查找自造小样" name="qa-cv-sample"></iframe>
<script>
(()=>{'use strict';const mode=new URL(location.href).searchParams.get('mode')==='cv'?'cv':'baseline',frame=document.getElementById('sample'),rows=64,history=[],visibility=new Map(),eventCounts={cv:0,toggle:0,scroll:0},cvEvents=[];
const result={schema:'study-cv-native-find-tiny.v1',mode,scope:'Synthetic 64 rows only. No source/proof/compiled runtime or real-card speed claim. Native Find and anchor actions must be performed by a human/UI.',userAgent:navigator.userAgent,origin:location.origin,supports:{contentVisibilityAuto:CSS.supports('content-visibility','auto'),containIntrinsicSize:CSS.supports('contain-intrinsic-size','auto 72px'),autoStateEvent:'oncontentvisibilityautostatechange' in document.documentElement},samples:history,events:eventCounts,cvEvents,error:null};
const status=text=>document.getElementById('status').textContent=mode+' | '+text;
function checksum(text){let n=2166136261;for(let i=0;i<text.length;i++)n=Math.imul(n^text.charCodeAt(i),16777619);return(n>>>0).toString(16).padStart(8,'0')}
function snapshot(doc){const major=Array.from(doc.querySelectorAll('.exam-frequency,.primary-definition,.secondary-definition,.etymology-section,.examples-section,iframe.etymology-source-frame')).filter(node=>node.getClientRects().length).map((node,index)=>{const box=node.getBoundingClientRect();return{index,tag:node.tagName,classes:node.className,top:Math.round(box.top*10)/10,height:Math.round(box.height*10)/10,width:Math.round(box.width*10)/10,childHeight:null,childInits:0}});return{bodyHeight:Math.round(doc.body.getBoundingClientRect().height*10)/10,textLength:null,nativeStates:[],major}}
function record(label,targetId=null){const doc=frame.contentDocument;const item={label,at:performance.now(),snapshot:snapshot(doc),scrollY:frame.contentWindow.scrollY,fonts:doc.fonts.status,detailOpen:doc.getElementById('audit').open,nodeCount:doc.querySelectorAll('*').length,rows:doc.querySelectorAll('li.example-card').length,bodyTextChecksumNonCrypto:checksum(doc.body.textContent),knownSkipped:[...visibility.values()].filter(Boolean).length};if(targetId){const target=doc.getElementById(targetId);item.targetSkippedBeforeRead=visibility.get(target.closest('li.example-card'))??null;const box=target.getBoundingClientRect();item.targetRectAfterRequestedRead={top:box.top,bottom:box.bottom,height:box.height,viewport:frame.contentWindow.innerHeight,intersects:box.bottom>0&&box.top<frame.contentWindow.innerHeight};item.targetReadCaveat='This explicit post-UI target read may itself force rendering; native success must be observed before pressing record.'}history.push(item);status(label+'; body='+item.snapshot.bodyHeight+'; scroll='+Math.round(item.scrollY)+'; details='+item.detailOpen+'; nodes='+item.nodeCount+'; skippedEvents='+item.knownSkipped);return item}
function stable(label){return new Promise((resolve,reject)=>{const began=performance.now();let prev=null,same=0,checks=0;function check(){try{const doc=frame.contentDocument;if(doc.fonts.status==='loading'){same=0}else{const state=JSON.stringify(snapshot(doc));if(state===prev)same++;else same=0;prev=state;if(same>=2){const sample=record(label);sample.gate={checks:++checks,elapsed:performance.now()-began,threeStableGeometrySamples:true};resolve(sample);return}}if(++checks>180||performance.now()-began>10000)throw Error('Tiny original-shape geometry gate timed out');requestAnimationFrame(check)}catch(error){reject(error)}}requestAnimationFrame(check)})}
const prose='This is synthetic bilingual evidence, preserving every original node. 这里是自造的完整双语正文，保留所有节点和段落。';let content='';for(let n=1;n<=rows;n++){const paragraphs=Array.from({length:1+n%5},(_,k)=>'<p>'+prose+' Paragraph '+(k+1)+'.</p>').join('');const unique=n===44?'<p id="plain-target">CVPlainK8R4 — ordinary far target</p>':'';const detail=n===57?'<details id="audit"><summary>第57行：闭合的原生审核</summary><p id="detail-target">CVClosedM7T2 — closed native details target</p></details>':'';const anchor=n===63?'<h3 id="deep-anchor" tabindex="-1">CVAnchorN9V6 — native fragment destination</h3>':'';content+='<li class="example-card"><h2>Row '+n+'</h2>'+paragraphs+unique+detail+anchor+'</li>'}
const src='<!doctype html><html lang="en"><meta charset="utf-8"><base href="about:srcdoc"><style>body{margin:16px;font:16px/1.55 system-ui;color:#172033}.primary-definition,.examples-section{max-width:850px;margin:auto}ol{list-style:none;padding:0;margin:0}.example-card{padding:12px;border:1px solid #ccd2dc;border-radius:8px;margin:0 0 14px;background:#fff}h2{margin:0;font-size:18px}p{margin:8px 0}details{background:#f4f6fa;padding:8px}.cv li.example-card{content-visibility:auto;contain-intrinsic-size:auto 72px}</style><body class="'+(mode==='cv'?'cv':'baseline')+'"><div class="primary-definition"><h1>原生内容/几何实验</h1><p>点击下面的原生链接可跳转到远端；不要手动打开第57行的审核。</p><a href="#deep-anchor">原生锚点：跳到远端第63行</a></div><section class="examples-section"><ol class="examples">'+content+'</ol></section></body></html>';
frame.style.cssText='position:absolute;left:0;top:calc(100vh + 100px);display:block;width:100%;height:calc(100vh - 132px);border:0;margin:0';
frame.addEventListener('load',async()=>{try{const doc=frame.contentDocument;doc.addEventListener('contentvisibilityautostatechange',event=>{eventCounts.cv++;visibility.set(event.target,!!event.skipped);if(cvEvents.length<24)cvEvents.push({at:performance.now(),row:event.target.querySelector('h2')?.textContent||null,skipped:!!event.skipped})},true);doc.addEventListener('toggle',event=>{if(event.target.id==='audit')eventCounts.toggle++},true);frame.contentWindow.addEventListener('scroll',()=>eventCounts.scroll++,{passive:true});record('stage-initial');await stable('stage-three-stable');document.getElementById('promote').disabled=false}catch(error){result.error={name:error.name,message:error.message};status('ERROR '+error.message)}},{once:true});frame.srcdoc=src;
document.getElementById('promote').onclick=async()=>{try{frame.style.cssText='display:block;width:100%;height:calc(100vh - 132px);border:0;margin:132px 0 0';record('promote-immediate');await stable('promote-three-stable')}catch(error){result.error={name:error.name,message:error.message};status('ERROR '+error.message)}};
for(const[id,target]of[['plain','plain-target'],['detail','detail-target'],['anchor','deep-anchor']])document.getElementById(id).onclick=()=>{try{record('after-native-'+id,target)}catch(error){result.error={name:error.name,message:error.message};status('ERROR '+error.message)}};
document.getElementById('download').onclick=()=>{result.manualNativeObservation={plainFoundAndVisible:document.getElementById('plainFound').checked,closedDetailsFoundAndVisible:document.getElementById('detailFound').checked,nativeAnchorVisible:document.getElementById('anchorFound').checked};result.finishedAt=performance.now();const blob=new Blob([JSON.stringify(result,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qa-cv-find-20261017-'+mode+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
})();
</script></html>
