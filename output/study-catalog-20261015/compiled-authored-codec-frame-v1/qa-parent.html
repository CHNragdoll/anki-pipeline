<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实小卡 FRAME 隔离验收</title><style>html,body{height:100%;margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6fb;color:#243044}header{padding:10px 14px;background:white;border-bottom:1px solid #d9e1ef;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{font:inherit}button{padding:6px 11px}small{color:#64748b}#status{white-space:pre-wrap;margin-left:auto}iframe{display:block;width:100%;height:calc(100% - 95px);border:0}details{padding:4px 14px;background:#fff}pre{max-height:180px;overflow:auto;font-size:12px}</style><header><b id="label"></b><button id="flip" disabled>使用原按钮翻面</button><button id="download">下载验收 JSON</button><a href="/baseline" target="_blank">基线页</a><a href="/candidate" target="_blank">候选页</a><span id="status">加载完整 FRAME…</span><small>真实字体/词源/音频；记录提交信号，不代表绘制或冷缓存上限。</small></header><details><summary>验收记录</summary><pre id="log"></pre></details><iframe id="frame" title="原完整 FRAME"></iframe><script>
(function(){'use strict';const variant=location.pathname.endsWith('candidate')?'candidate':'baseline',frame=document.getElementById('frame'),status=document.getElementById('status'),flip=document.getElementById('flip'),rows=[],navigationStarted=performance.now();let packet=null,manifest=null,mountStarted=null,firstFront=null,firstBack=null,lastRequest=null,lastCommit=null,failed=false;
 document.getElementById('label').textContent='2026 abolish · '+variant;
 const now=()=>performance.now(),push=row=>{rows.push(row);document.getElementById('log').textContent=JSON.stringify(rows,null,2)};
 function live(){try{const d=frame.contentDocument,button=d?.getElementById('study-flip'),side=d?.getElementById('study-side');if(!packet||!button||button.disabled||!side||side.dataset.cardId!==packet.id||side.dataset.mountReason!=='connected-complete-card')return null;return{button,side,document:side.contentDocument,answer:button.getAttribute('aria-pressed')==='true'}}catch(_){return null}}
 function flipOriginal(reason){const state=live();if(!state||failed)return false;lastRequest={reason,at:now(),answer:!state.answer};push({event:'flip-request',...lastRequest});state.button.click();return true}
 function snapshot(){return{schema:'study-authored-codec-safari-observation.v1',variant,url:location.href,fixtureFreeze:manifest?.fixture_freeze_sha256,id:packet?.id,token:packet?.token,firstFrontMs:firstFront===null?null:firstFront-mountStarted,immediateBackMs:firstBack===null||firstFront===null?null:firstBack-firstFront,navigationToFrontMs:firstFront===null?null:firstFront-navigationStarted,failed,rows,scope:'Parent to source/token-checked full commit signals. Not paint, cold-cache guarantee, package or largest-card acceptance.',manifest}}
 Object.defineProperty(window,'StudyAuthoredCodecQA',{value:Object.freeze({snapshot,flip:()=>flipOriginal('manual-parent'),liveDocument:()=>live()?.document||null}),writable:false});
 window.addEventListener('message',event=>{const data=event.data;if(event.origin!==location.origin||event.source!==frame.contentWindow||!packet||data?.id!==packet.id||data?.token!==packet.token)return;if(data.type==='study-source-error'){failed=true;push({event:'source-error',at:now(),message:data.message});status.textContent='失败：'+data.message;flip.disabled=true;return}if(data.type!=='study-side-state')return;const state=live();if(!state||state.answer!==data.answer)return;if(lastCommit?.document===state.document&&lastCommit.answer===state.answer)return;const at=now();lastCommit={document:state.document,answer:state.answer};const requested=lastRequest;lastRequest=null;push({event:'complete-side-commit',at,answer:state.answer,id:data.id,token:data.token,sourceChecked:true,request:requested?.reason||null,requestToCommitMs:requested?at-requested.at:null});flip.disabled=false;
 if(firstFront===null&&!state.answer){firstFront=at;status.textContent='正面 '+(at-mountStarted).toFixed(1)+' ms；立即请求背面…';flipOriginal('immediate-after-front');return}
 if(firstBack===null&&state.answer){firstBack=at;status.textContent='背面提交 '+(at-firstFront).toFixed(1)+' ms；可直接测试筛年 / chunk / 音频 / Find';push({event:'first-round-complete',frontMs:firstFront-mountStarted,immediateBackMs:firstBack-firstFront,nativeState:state.document.querySelector('script.anki-final-reviewed-data')?.dataset.nativeState||null,sentenceRoots:state.document.querySelectorAll('.sf-example,.example-card').length,auditReasons:state.document.querySelectorAll('.sf-reason').length});return}
 status.textContent='已提交'+(state.answer?'背面':'正面')+'；手动往返正常';
 });
 flip.onclick=()=>flipOriginal('manual-parent');
 document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='authored-codec-'+variant+'-observation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 frame.onload=async()=>{try{const api=frame.contentWindow.StudySharedFrame;if(!api)throw Error('完整 FRAME API 未建立');manifest=await(await fetch('/manifest.json',{cache:'no-store'})).json();packet=await(await fetch('/packet.json',{cache:'no-store'})).json();packet.base=location.origin+'/book/media/';packet.requestedAt=now();mountStarted=now();push({event:'mount-request',at:mountStarted,id:packet.id,token:packet.token,sourceWrapper:packet.prepared.source_wrapper_sha256,variant});const mounted=await api.mount(packet);push({event:'mount-return',at:now(),mounted});if(mounted!==true)throw Error('原 mount 未提交正面')}catch(error){failed=true;status.textContent='失败：'+error.message;push({event:'parent-error',at:now(),message:error.message})}};
 frame.src='/book/'+variant+'-frame.html';
})();
</script></html>
