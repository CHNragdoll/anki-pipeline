{{FrontSide}}
<main class="vocab-card vocab-back">
  {{#SimpleDefinition}}<section class="simple-definition" aria-label="简明释义">{{SimpleDefinition}}</section>{{/SimpleDefinition}}
  {{#Definition}}<section class="detail-section"><h2>释义</h2><div class="definition">{{Definition}}</div></section>{{/Definition}}
  {{#WordForms}}<section class="detail-section"><h2>词形</h2><div>{{WordForms}}</div></section>{{/WordForms}}
  {{#Level}}<p class="level">{{Level}}</p>{{/Level}}
  {{#Examples}}<section class="detail-section"><h2>例句</h2><ol class="examples">{{Examples}}</ol></section>{{/Examples}}
  {{#Note}}<section class="detail-section personal-note"><h2>我的笔记</h2><div>{{Note}}</div></section>{{/Note}}
</main>
